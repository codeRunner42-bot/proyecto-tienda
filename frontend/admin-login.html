<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso seguro al panel de administración de Ale Beauty Art.">
  <title>Acceso Admin - Ale Beauty Art</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F484;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-screen">
  <div class="login-card">
    <a href="index.html" class="admin-back-shop">← Volver a la tienda</a>
    <h1>Acceso Admin</h1>
    <p>Ingresa tus credenciales para gestionar productos y pedidos.</p>
    
    <div id="loginStatus"></div>
    
    <form id="loginForm" class="admin-form">
      <label>Usuario
        <input type="text" name="user" placeholder="Ej: admin" required>
      </label>
      <label>Contraseña
        <input type="password" name="pass" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
    </form>
  </div>
  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="assets/js/admin-login.js"></script>
</body>
</html>
