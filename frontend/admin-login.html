<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Administración</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-screen">
  <div class="login-card">
    <a href="index.html" style="display:block; text-align:center; margin-bottom:20px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:2px;">← Volver a la tienda</a>
    <h1>Acceso Admin</h1>
    <p>Ingresa tus credenciales para gestionar productos y pedidos.</p>
    
    <div id="loginStatus"></div>
    
    <form id="loginForm" class="admin-form">
      <label>Usuario
        <input type="text" name="user" placeholder="Ej: admin" required>
      </label>
      <label>Contraseña
        <input type="password" name="pass" placeholder="••••••••" required>
      </label>
      <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
    </form>
  </div>
  <script src="assets/js/admin-login.js"></script>
</body>
</html>
