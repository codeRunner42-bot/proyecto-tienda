<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pedidos</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <h1>Pedidos Recibidos</h1>
    <div id="orderStatus"></div>
    <div class="admin-actions">
      <a href="admin.html" class="btn btn-secondary">Volver a Productos</a>
      <input type="text" id="orderSearch" placeholder="Buscar por cliente o ID...">
    </div>
    <table id="ordersTable" class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Total</th>
          <th>Pago</th>
          <th>Estado</th>
          <th>Fecha</th>
          <th>Cambiar Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="assets/js/admin-orders.js"></script>
</body>
</html>
