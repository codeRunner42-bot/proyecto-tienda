<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pedidos - Ale Beauty Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <h1 class="admin-page-title">Pedidos Recibidos</h1>
    
    <!-- TARJETAS DE ESTADISTICAS -->
    <div class="admin-stats-grid" id="statsGrid">
      <div class="stat-card">
        <span class="stat-card-title">Total Facturado</span>
        <span class="stat-card-val" id="statRevenue">$0</span>
        <span class="stat-card-icon">💰</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-title">Pedidos Recibidos</span>
        <span class="stat-card-val" id="statOrders">0</span>
        <span class="stat-card-icon">📦</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-title">Ticket Promedio</span>
        <span class="stat-card-val" id="statAvgTicket">$0</span>
        <span class="stat-card-icon">📈</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-title">Bajo Stock (≤2)</span>
        <span class="stat-card-val" id="statLowStock">0</span>
        <span class="stat-card-icon">⚠️</span>
      </div>
    </div>

    <div id="orderStatus"></div>
    <div class="admin-actions">
      <a href="admin.html" class="btn btn-secondary">Volver a Productos</a>
      <a href="index.html" class="btn btn-secondary">Ver Tienda</a>
      <button id="logoutBtn" class="btn btn-danger">Cerrar Sesión</button>
      <input type="text" id="orderSearch" placeholder="Buscar por cliente o ID...">
    </div>
    <table id="ordersTable" class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Total</th>
          <th>Pago</th>
          <th>Estado</th>
          <th>Fecha</th>
          <th>Cambiar Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="assets/js/admin-orders.js"></script>
</body>
</html>
