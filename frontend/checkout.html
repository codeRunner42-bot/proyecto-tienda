<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout - Tienda</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="top-bar page-wrapper">
      <p>Listo para tu compra • Confirmación por WhatsApp • <a href="https://www.instagram.com/ale.beautyart/" target="_blank">Instagram</a></p>
    </div>

    <div class="main-header page-wrapper">
      <a class="back-btn" href="cart.html">← Carrito</a>
      <a class="brand" href="index.html">Tienda</a>
      <div class="header-actions">
        <a class="cart" id="cartBtn" href="cart.html">Carrito (<span id="cartCount">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="page-header page-wrapper">
      <div>
        <h2>Confirmar Pedido</h2>
        <p>Llena tus datos y elige el método de pago para enviar tu orden por WhatsApp.</p>
      </div>
    </section>

    <section class="page-wrapper checkout-grid">
      <div class="order-summary" id="orderSummary"></div>
      <form id="orderForm" class="checkout-form">
        <h3>Detalles de compra</h3>
        <label>Nombre*: <input type="text" name="firstName" required/></label>
        <label>Apellidos*: <input type="text" name="lastName" required/></label>
        <label>Teléfono* (WhatsApp): <input type="tel" name="phone" required/></label>
        <label>Dirección: <input type="text" name="address"/></label>
        <h4>Método de pago</h4>
        <div class="payment-options">
          <label><input type="radio" name="payment" value="nequi" checked/> Nequi</label>
          <label><input type="radio" name="payment" value="contra_entrega"/> Contra entrega</label>
        </div>
        <button type="submit">Finalizar y enviar pedido por WhatsApp</button>
      </form>
    </section>
  </main>

  <footer class="page-footer page-wrapper">
    <div>Conéctate con nosotros: <a href="https://www.instagram.com/ale.beautyart/" target="_blank">Instagram</a></div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
