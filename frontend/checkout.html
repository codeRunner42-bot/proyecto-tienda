<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finalizar Compra - Ale Beauty Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="top-bar page-wrapper">
      <p>Listo para tu compra • <a href="tracking.html">Rastrear Pedido</a> • <a href="account.html">Mi Cuenta</a> • <a href="https://www.instagram.com/ale.beautyart/" target="_blank">Instagram</a></p>
    </div>

    <div class="main-header page-wrapper">
      <a class="back-btn" href="cart.html">← Carrito</a>
      <a class="brand-logo" href="index.html">
        <div class="logo-badge">AB</div>
        <span class="logo-text">Ale Beauty Art</span>
      </a>
      <div class="header-actions">
        <button class="dark-mode-toggle" id="themeToggle" title="Cambiar Tema">🌙</button>
        <a class="cart" id="cartBtn" href="cart.html">
          <span class="cart-icon">🛒</span>
          <span class="cart-text">Carrito (<span id="cartCount">0</span>)</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="page-header page-wrapper">
      <div>
        <h2>Confirmar Pedido</h2>
        <p>Llena tus datos y elige el método de pago para enviar tu orden por WhatsApp.</p>
      </div>
    </section>

    <section class="page-wrapper checkout-grid">
      <div class="order-summary" id="orderSummary"></div>
      <form id="orderForm" class="checkout-form">
        <h3>Detalles de compra</h3>
        <label>Nombre*: <input type="text" name="firstName" required/></label>
        <label>Apellidos*: <input type="text" name="lastName" required/></label>
        <label>Documento de Identidad / Cédula*: <input type="text" name="documentId" required pattern="\d{5,15}" title="La cédula debe contener únicamente entre 5 y 15 dígitos numéricos sin puntos ni guiones."/></label>
        <label>Teléfono* (WhatsApp): <input type="tel" name="phone" required pattern="\d{7,15}" title="El teléfono debe contener únicamente entre 7 y 15 dígitos numéricos."/></label>
        <label>Dirección: <input type="text" name="address"/></label>
        <h4>Método de pago</h4>
        <div class="payment-options">
          <label><input type="radio" name="payment" value="nequi" checked/> Nequi</label>
          <label><input type="radio" name="payment" value="contra_entrega"/> Contra entrega</label>
        </div>
        <button type="submit">Finalizar y enviar pedido por WhatsApp</button>
      </form>
    </section>
  </main>

  <footer class="page-footer page-wrapper">
    <div>Conéctate con nosotros: <a href="https://www.instagram.com/ale.beautyart/" target="_blank">Instagram</a></div>
  </footer>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
