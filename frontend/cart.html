<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Revisa tu carrito de compras en Ale Beauty Art. Ajusta cantidades y selecciona los productos que quieres comprar.">
  <title>Carrito - Ale Beauty Art</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F6D2;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
 </head>
<body>
  <header class="site-header">
    <div class="top-bar page-wrapper">
      <p>Compra segura • <a href="tracking.html">Rastrear Pedido</a> • <a href="account.html">Mi Cuenta</a> • <a href="https://www.instagram.com/ale.beautyart/" target="_blank">Instagram</a></p>
    </div>

    <div class="main-header page-wrapper">
      <a class="back-btn" href="index.html">← Volver</a>
      <a class="brand-logo" href="index.html">
        <img src="assets/images/logo.jpg" alt="Logo" class="logo-badge" style="object-fit: cover;">
        <span class="logo-text">Ale Beauty Art</span>
      </a>
      <div class="header-actions">
        <button class="dark-mode-toggle" id="themeToggle" title="Cambiar Tema">🌙</button>
        <a class="cart" id="cartBtn" href="cart.html">
          <span class="cart-icon">🛒</span>
          <span class="cart-text">Carrito (<span id="cartCount">0</span>)</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="page-header page-wrapper">
      <div>
        <h2>Tu Carrito</h2>
        <p>Revisa lo que has agregado, ajusta las cantidades y selecciona los artículos que quieres comprar.</p>
      </div>
    </section>

    <section class="page-wrapper">
      <div id="cartList"></div>
      <div class="action-row">
        <button class="btn btn-secondary" id="backShop" onclick="location.href='index.html'">Seguir comprando</button>
        <button class="btn btn-primary" id="buyBtn">Comprar seleccionados</button>
      </div>
    </section>
  </main>

  <footer class="page-footer page-wrapper">
    <div>Conéctate con nosotros: <a href="https://www.instagram.com/ale.beautyart/" target="_blank">Instagram</a></div>
    <div>Tel/WhatsApp: <a id="whatsappLink" href="#">Enviar WhatsApp</a></div>
  </footer>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cart.js"></script>
</body>
</html>
